<!-- Backdrop overlay -->
<div class="sidebar-backdrop" [class.active]="isOpen" (click)="closeSidebar()"></div>

<div class="address-sidebar-container" [class.open]="isOpen">
  <!-- Header -->
  <div class="sidebar-header">
    <h2>SELECT DELIVERY ADDRESS</h2>
    <button class="close-btn" (click)="closeSidebar()" aria-label="Close sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Add New Address Button Action -->
  <div class="add-address-section">
    <button class="add-address-btn" (click)="addNewAddress()">
      + ADD NEW ADDRESS
    </button>
  </div>

  <!-- Address List Section -->
  <div class="sidebar-content">
    <div class="address-list">
      @for (address of addresses; track address.id) {
        <div 
          class="address-card" 
          [class.selected]="selectedAddressId === address.id"
          (click)="selectAddress(address.id)">
          
          <div class="address-header-row">
            <span class="recipient-name">{{ address.name }}</span>
            <div class="radio-indicator">
              @if (selectedAddressId === address.id) {
                <div class="radio-inner"></div>
              }
            </div>
          </div>

          <p class="address-details">{{ address.fullAddress }}</p>
          <p class="recipient-phone">{{ address.phone }}</p>

          @if (selectedAddressId === address.id) {
            <div class="address-actions">
              <button class="edit-addr-btn" (click)="editAddress(address, $event)">EDIT</button>
            </div>
            <button class="deliver-btn" (click)="deliverToThisAddress($event)">
              Deliver to this Address
            </button>
          }
        </div>
      }
    </div>
  </div>

  <app-edit-add-address
    [isOpen]="isAddressFormOpen"
    [mode]="addressFormMode"
    [address]="editingAddress"
    (isOpenChange)="isAddressFormOpen = $event"
    (addressSaved)="saveAddress($event)">
  </app-edit-add-address>
</div>
