<section class="bank-upi-wrapper">
  <div class="container-fuild">
    <div class="bank-upi-main">
      <!-- Header Section -->
      <div class="page-header">
        <button class="back-btn" (click)="onBackClick()" aria-label="Go back">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h2>{{ pageData.headerTitle }}</h2>
      </div>

      <!-- Banner / Subtitle Section -->
      <div class="info-banner">
        <p>{{ pageData.bannerText }}</p>
      </div>

      <!-- Options List Section -->
      <ul class="details-list">
        <li *ngFor="let item of pageData.items" class="detail-item" (click)="onItemAction(item)">
          <div class="item-left">
            <span class="icon-wrapper">
              <img [src]="item.icon" [alt]="item.label" />
            </span>
            <span class="item-label">{{ item.label }}</span>
          </div>
          <button class="action-btn" (click)="$event.stopPropagation(); onItemAction(item)">
            {{ item.actionText }}
          </button>
        </li>
      </ul>
    </div>
  </div>
</section>
